name: Validate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-hooks:
    name: Validate Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: bash scripts/validate-hooks.sh

  validate-skills:
    name: Validate Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/validate-skills.sh

  validate-scripts:
    name: Validate Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/execute-pipeline.sh scripts/new-client.sh scripts/sync-skills.sh scripts/usage-report.sh scripts/validate-hooks.sh scripts/validate-skills.sh scripts/pipeline-wip-restore.sh scripts/test-pipeline-wip-restore.sh scripts/hooks/test-session-hooks.sh
      # pipeline-wip-restore.sh only ever runs on the failure path of a pipeline run, so a
      # regression in it would stay invisible until the run it was supposed to protect.
      # The harness drives real throwaway repos — git + bash only, no npm install needed.
      - name: pipeline-wip-restore behavioral tests
        run: bash scripts/test-pipeline-wip-restore.sh
      # The Stop hooks are the capture layer the whole learning loop reads from, and
      # both of their historic defects (mtime transcript selection, flat entry schema)
      # failed SILENTLY — no error, just empty output for months. Only a behavioral
      # test over a real captured transcript catches that class.
      - name: session-hook behavioral tests
        run: bash scripts/hooks/test-session-hooks.sh
      - name: pattern-harvest aggregator tests
        run: python3 scripts/hooks/test-pattern-harvest.py

  validate-workflows:
    name: Validate Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/validate-workflows.mjs

  # Behavioral + drift-guard harnesses for the workflow scripts. Runs AFTER validate-workflows
  # (compile-only) so the workflows are known to parse before they are behavior-tested. No
  # `npm install` — the harnesses import only Node built-ins (node:assert/fs/path/url) plus the
  # local ./classify-tier.mjs sibling (root deps @biomejs/biome + typescript are unused). No
  # `permissions:` block — the job only reads checked-out files and runs node (no GitHub API,
  # no $GITHUB_OUTPUT writes), so the default `contents: read` suffices. The harnesses must NOT
  # be added to scripts/validate-workflows.mjs's glob: it wraps each file in a vm.Script async
  # wrapper that rejects their top-level await/import; they run directly with `node` here.
  test-workflows:
    name: Test Workflows
    runs-on: ubuntu-latest
    needs: [validate-workflows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: classifyTier unit tests
        run: node .claude/workflows/classifyTier.test.mjs
      - name: execute-pipeline behavioral tests
        run: node .claude/workflows/execute-pipeline.test.mjs
      - name: dual-adversarial behavioral tests
        run: node .claude/workflows/dual-adversarial.test.mjs

  runtime-checks:
    name: Runtime (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check runtime/ presence
        id: presence
        run: |
          if [ -f runtime/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install runtime deps
        if: steps.presence.outputs.exists == 'true'
        working-directory: runtime
        run: npm ci
      - name: Typecheck runtime
        if: steps.presence.outputs.exists == 'true'
        working-directory: runtime
        run: npx tsc --noEmit
      # The base tsconfig EXCLUDES **/*.test.ts and vitest SKIPS the opt-in VPS
      # e2e by default, so phase-2-vps.test.ts — the proof artifact for the
      # IRREVERSIBLE production cutover — is otherwise type-unchecked (a round-1
      # ReferenceError shipped exactly that way). tsconfig.e2e.json type-checks the
      # Phase 2 integration test BODIES so a regression inside them fails CI.
      - name: Typecheck Phase 2 e2e test bodies
        if: steps.presence.outputs.exists == 'true'
        working-directory: runtime
        run: npx tsc -p tsconfig.e2e.json
      - name: Test runtime (with coverage)
        if: steps.presence.outputs.exists == 'true'
        working-directory: runtime
        run: npx vitest run --coverage
      # vitest's include glob is **/*.test.ts, so the acceptance-gate's node:test
      # suite (check-evidence.test.mjs) is NOT collected by the step above. Run it
      # explicitly — check-evidence.mjs IS the Phase 2 gate, so its regression net
      # must execute on every PR (matches the explicit node:test pattern in the
      # test-workflows job).
      - name: Test runtime acceptance-gate scripts (node:test)
        if: steps.presence.outputs.exists == 'true'
        working-directory: runtime
        run: npm run test:gate
